name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing here publishes, so superseded runs are always safe to cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The prepare script installs Git hooks, which CI has no use for.
  HUSKY: 0

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: resume/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: resume/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Date parsing self-check
        run: pnpm selfcheck

      # `build` runs `tsc --noEmit` before Vite, so this covers type-checking too.
      - name: Type-check and build
        run: pnpm build
