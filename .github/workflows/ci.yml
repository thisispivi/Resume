name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing here publishes, so superseded runs are always safe to cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The prepare script installs Git hooks, which CI has no use for.
  HUSKY: 0

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resume
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Peer dependencies
        run: pnpm peers check

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Date parsing self-check
        run: pnpm selfcheck

      # `build` runs `tsc --noEmit` before Vite, so this covers type-checking too.
      - name: Type-check and build
        run: pnpm build
