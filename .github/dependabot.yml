version: 2

updates:
  - package-ecosystem: npm
    directory: /resume
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the review surface small; CI gates each group.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      linting:
        patterns: ["eslint*", "@eslint/*", "@typescript-eslint/*", "prettier*"]
      build:
        patterns: ["vite", "@vitejs/*", "rolldown-vite", "sass", "postcss", "autoprefixer"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-plugin-react 7.37.5 does not work with ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # typescript-eslint does not support the TypeScript 7 compiler yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
