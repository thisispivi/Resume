# Dependabot: security updates open as soon as an advisory lands; version
# updates arrive once a week, minor and patch grouped into one pull request.
# Triage both with the fix-vulnerabilities skill (.claude/skills/).
version: 2
updates:
  - package-ecosystem: npm
    directory: /resume
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-react 7.37.5 does not work with ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # typescript-eslint does not support the TypeScript 7 compiler yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
